# ~/.config/hypr/hyprlock.conf 
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/awesome/themes/powerarrow-dark/wallpapers/gen/dsmin.jpg
    color = rgb(1A1A1A)
    blur_passes = 2
}

label {
    monitor =
    text = $TIME
    color = rgb(FFFFFF)
    font_size = 48
    font_family = Cantarell
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 15%, 4%
    outline_thickness = 1
    rounding = 0
    outer_color = rgb(3F3F3F)
    inner_color = rgb(1A1A1A)
    font_color = rgb(FFFFFF)
    font_family = Cantarell
    check_color = rgb(CC9393)
    fail_color = rgb(913831)
    placeholder_text = <i>Password...</i>
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}
